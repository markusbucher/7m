# Xcode-Projekt erzeugen (macOS):  brew install xcodegen && cd iosApp && xcodegen
name: 7m
options:
  bundleIdPrefix: de.tanpau
  deploymentTarget:
    iOS: "16.0"
targets:
  7m:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: 7m
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tanpau.sevenm
        PRODUCT_NAME: 7m
        # Swift-Modulnamen dürfen nicht mit einer Ziffer beginnen.
        PRODUCT_MODULE_NAME: SevenM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Das Gradle-Skript unten braucht Zugriff auf das ganze Repository.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Kotlin-Framework bauen
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
